<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Espace organisateur — Lynn 40 ans</title>
<style>
  :root{
    --cream:#FDF7F2; --paper:#FFFDFB; --blush:#F7E3E7; --rose:#B34A63;
    --rose-deep:#8E3A50; --gold:#B98A2F; --gold-soft:#D8BC7E;
    --ink:#4A3B38; --ink-soft:#8A7570; --line:#EDD9CE;
    --ok:#4C7A4C; --ok-bg:#E8F1E4; --warn:#9A6A1B; --warn-bg:#F8ECD2;
    --off:#8A7570; --off-bg:#F0E8E4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
  .wrap{max-width:520px;margin:0 auto;padding:0 20px 60px}
  .masthead{text-align:center;padding:28px 20px 4px}
  .eyebrow{font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin:0}
  .script{font-family:'Segoe Script','Brush Script MT',cursive;color:var(--rose);font-size:34px;margin:6px 0 0}
  .sub{font-family:system-ui,sans-serif;font-size:12px;color:var(--ink-soft);margin:4px 0 0}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
  .card h2{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--rose-deep);margin:0 0 12px;font-weight:400}

  button, input{font-family:system-ui,sans-serif;font-size:15px;color:var(--ink)}
  input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;margin-top:6px}
  input:focus, button:focus-visible{outline:2px solid var(--gold-soft);outline-offset:1px}
  label{font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-top:14px}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:13px;background:var(--rose);color:#fff;letter-spacing:.08em;text-transform:uppercase;font-size:13px;cursor:pointer;margin-top:14px}
  .btn:hover{background:var(--rose-deep)}
  .btn.gold{background:var(--gold)}
  .btn.gold:hover{background:#9A7326}

  .stand{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;background:#fff}
  .stand .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .stand .name{font-size:16px;margin:0}
  .badge{font-family:system-ui,sans-serif;font-size:11.5px;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.off{background:var(--off-bg);color:var(--off)}
  .seg{display:flex;gap:6px;margin-top:10px}
  .seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 2px;font-size:12px;cursor:pointer;color:var(--ink-soft)}
  .seg button.sel{border-color:var(--rose);background:var(--blush);color:var(--rose-deep);font-weight:600}
  .wait-ctl{display:flex;align-items:center;gap:10px;margin-top:8px;font-family:system-ui,sans-serif;font-size:12px;color:var(--ink-soft)}
  .wait-ctl button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:15px;line-height:1}
  .wait-ctl b{color:var(--ink);font-variant-numeric:tabular-nums}
  .maj{font-family:system-ui,sans-serif;font-size:11.5px;color:var(--ink-soft);margin:0 0 4px;text-align:right}

  .order{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-family:system-ui,sans-serif;font-size:14px}
  .order:last-child{border-bottom:none}
  .order .t{font-size:11.5px;color:var(--ink-soft)}
  .order button{border:1px solid var(--ok);background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:6px 14px;font-size:12.5px;cursor:pointer}
  .empty{font-family:system-ui,sans-serif;font-size:13px;color:var(--ink-soft);font-style:italic;padding:6px 0}

  .recap-stats{display:flex;gap:8px;margin-top:4px;text-align:center}
  .recap-stats div{flex:1;background:var(--blush);border-radius:10px;padding:10px 4px}
  .recap-stats .n{font-size:22px;color:var(--rose-deep);font-variant-numeric:tabular-nums}
  .recap-stats .l{font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--rose);margin-top:3px}
  .recap-list{margin-top:10px}
  .recap-list > div{font-family:system-ui,sans-serif;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
  .recap-list .who{font-weight:600}
  .recap-list .det{color:var(--ink-soft);font-size:12px;margin-top:2px}

  .journal{margin-top:4px}
  .journal div{font-family:system-ui,sans-serif;font-size:12.5px;color:var(--ink-soft);padding:5px 0;border-bottom:1px dashed var(--line)}
  .journal div b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

  .refresh-note{font-family:system-ui,sans-serif;font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:8px}
  #gate{max-width:360px;margin:16vh auto 0;padding:0 20px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:90%;background:var(--ink);color:#fff;font-family:system-ui,sans-serif;font-size:13.5px;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div id="gate">
  <div class="masthead">
    <p class="eyebrow">Espace organisateur</p>
    <p class="script">Lynn — 40 ans</p>
  </div>
  <div class="card">
    <label for="g-code">Code organisateur</label>
    <input id="g-code" type="password" inputmode="numeric" placeholder="••••">
    <button class="btn" id="g-go">Entrer</button>
  </div>
</div>

<div class="wrap" id="dash" style="display:none">
  <div class="masthead">
    <p class="eyebrow">Espace organisateur</p>
    <p class="script">Lynn — 40 ans</p>
    <p class="sub">Réservé à l'équipe — actualisation automatique toutes les 15 s</p>
  </div>

  <div class="card">
    <h2>🍸 Commandes de cocktails</h2>
    <div id="orders"></div>
  </div>

  <div class="card">
    <h2>Stands</h2>
    <p class="maj" id="stands-maj"></p>
    <div id="stands"></div>
    <button class="btn gold" id="releve">Copier le relevé de l'heure</button>
  </div>

  <div class="card">
    <h2>Réponses RSVP</h2>
    <div id="recap"></div>
  </div>

  <div class="card">
    <h2>Journal</h2>
    <div class="journal" id="journal"></div>
  </div>

  <p class="refresh-note">Page réservée à l'organisation — ne partagez pas ce lien avec les invités.</p>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
var SUPABASE_URL = "https://mleqvlkadbkvmbhpiike.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1sZXF2bGthZGJrdm1iaHBpaWtlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NzYyMzIsImV4cCI6MjA5OTQ1MjIzMn0.GNIw5n1BnraNMlPw8A0i9QQ2nbBOp3WfS0A7se3tJko";
var CODE = "1508";

(function(){
  function api(method,path,body,prefer){
    return fetch(SUPABASE_URL+'/rest/v1/'+path,{
      method:method,
      headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:prefer||'return=representation'},
      body:body?JSON.stringify(body):undefined
    }).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.status===204?null:r.json()});
  }
  var toastEl=document.getElementById('toast'),toastT;
  function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('show')},2600)}
  function offline(){toast('Connexion impossible — réessayez')}
  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
  function pad(n){return n<10?'0'+n:''+n}
  function now(){var d=new Date();return pad(d.getHours())+'h'+pad(d.getMinutes())}
  function hm(iso){var d=new Date(iso);return pad(d.getHours())+'h'+pad(d.getMinutes())}

  /* ---------- Porte d'entrée ---------- */
  function open(){
    document.getElementById('gate').style.display='none';
    document.getElementById('dash').style.display='block';
    fetchAll();
    setInterval(function(){if(!document.hidden)fetchAll()},15000);
  }
  function tryCode(){
    if(document.getElementById('g-code').value===CODE){
      try{localStorage.setItem('lynn40_org','1')}catch(e){}
      open();
    }else{toast('Code incorrect')}
  }
  document.getElementById('g-go').addEventListener('click',tryCode);
  document.getElementById('g-code').addEventListener('keydown',function(e){if(e.key==='Enter')tryCode()});
  try{if(localStorage.getItem('lynn40_org')==='1')open()}catch(e){}

  /* ---------- Données ---------- */
  var STANDS=[
    {id:'dibi',n:'🔥 Dibiterie',star:true},
    {id:'cocktail',n:'🍸 Stand cocktails'},
    {id:'jus',n:'🍹 Bar à jus & bissap'},
    {id:'champ',n:'🥂 Champagne & douceurs'},
    {id:'cake',n:'🎂 Le gâteau de Lynn'},
    {id:'photo',n:'📸 Photobooth'}
  ];
  var LABELS={ok:'Disponible',warn:'Forte affluence',off:'Fermé'};
  var st={},orders=[],journal=[];
  function standName(id){var f=STANDS.filter(function(o){return o.id===id});return f.length?f[0].n:id}
  function standLabel(x){return x.lbl||LABELS[x.s]||x.s}

  function fetchAll(){
    api('GET','stands?select=*').then(function(rows){
      var latest=null;
      rows.forEach(function(r){st[r.id]={s:r.status,w:r.wait,lbl:r.label};if(!latest||r.updated_at>latest)latest=r.updated_at});
      st.maj=latest?hm(latest):null;paintStands();
    }).catch(function(){});
    api('GET','cocktail_orders?select=*&order=created_at.asc').then(function(rows){
      orders=rows;paintOrders();
    }).catch(function(){paintOrders(true)});
    api('GET','events?select=*&order=t.desc&limit=15').then(function(rows){
      journal=rows;paintJournal();
    }).catch(function(){});
    api('GET','rsvps?select=*&order=updated_at.desc').then(paintRecap).catch(function(){});
  }
  function logEvent(txt){api('POST','events',{txt:txt},'return=minimal').catch(function(){})}

  /* ---------- Stands ---------- */
  function paintStands(){
    var el=document.getElementById('stands');
    el.innerHTML=STANDS.map(function(o){
      var x=st[o.id]||{s:'ok'};
      var h='<div class="stand" data-id="'+o.id+'">'+
        '<div class="row"><p class="name">'+o.n+'</p><span class="badge '+x.s+'">'+esc(standLabel(x))+'</span></div>'+
        '<div class="seg">'+['ok','warn','off'].map(function(s){
          return '<button data-s="'+s+'" class="'+(x.s===s&&!x.lbl?'sel':'')+'">'+LABELS[s]+'</button>';
        }).join('')+'</div>';
      if(o.star){h+='<div class="wait-ctl"><span>Attente</span><button data-w="-5">−</button><b>'+(x.w||5)+' min</b><button data-w="5">+</button></div>'}
      return h+'</div>';
    }).join('');
    document.getElementById('stands-maj').textContent=st.maj?'Dernière mise à jour à '+st.maj:'';
    el.querySelectorAll('.seg button').forEach(function(b){
      b.addEventListener('click',function(){
        var id=b.closest('.stand').dataset.id;
        api('PATCH','stands?id=eq.'+id,{status:b.dataset.s,label:null,updated_at:new Date().toISOString()},'return=minimal')
          .then(function(){logEvent(standName(id)+' → '+LABELS[b.dataset.s]);fetchAll()}).catch(offline);
      });
    });
    el.querySelectorAll('.wait-ctl button').forEach(function(b){
      b.addEventListener('click',function(){
        var id=b.closest('.stand').dataset.id;
        var w=Math.min(45,Math.max(0,((st[id]||{}).w||5)+(+b.dataset.w)));
        api('PATCH','stands?id=eq.'+id,{wait:w,updated_at:new Date().toISOString()},'return=minimal')
          .then(fetchAll).catch(offline);
      });
    });
  }

  /* ---------- Commandes ---------- */
  function paintOrders(missing){
    var el=document.getElementById('orders');
    if(missing){el.innerHTML='<p class="empty">Table des commandes introuvable — exécutez le script supabase-update-cocktails.sql dans Supabase.</p>';return}
    var att=orders.filter(function(o){return o.status==='attente'});
    var srv=orders.filter(function(o){return o.status==='servie'});
    el.innerHTML=(att.length?att.map(function(o){
      return '<div class="order"><div><b>'+esc(o.cocktail)+'</b> pour '+esc(o.guest_name)+
        '<div class="t">commandé à '+hm(o.created_at)+'</div></div>'+
        '<button data-id="'+o.id+'">Servie ✓</button></div>';
    }).join(''):'<p class="empty">Aucune commande en attente.</p>')+
    '<p class="refresh-note">'+srv.length+' commande'+(srv.length>1?'s':'')+' servie'+(srv.length>1?'s':'')+' · '+att.length+' en attente</p>';
    el.querySelectorAll('.order button').forEach(function(b){
      b.addEventListener('click',function(){
        api('PATCH','cocktail_orders?id=eq.'+b.dataset.id,{status:'servie'},'return=minimal')
          .then(function(){toast('Commande marquée servie');fetchAll()}).catch(offline);
      });
    });
  }

  /* ---------- RSVP ---------- */
  function paintRecap(rows){
    var oui=0,pe=0,non=0,pers=0;
    rows.forEach(function(r){
      if(r.choice==='oui'){oui++;pers+=1+(r.adults||0)+(r.kids||0)}
      else if(r.choice==='non'){non++}else{pe++}
    });
    document.getElementById('recap').innerHTML=
      '<div class="recap-stats">'+
      '<div><div class="n">'+oui+'</div><div class="l">oui</div></div>'+
      '<div><div class="n">'+pe+'</div><div class="l">peut-être</div></div>'+
      '<div><div class="n">'+non+'</div><div class="l">non</div></div>'+
      '<div><div class="n">'+pers+'</div><div class="l">personnes</div></div>'+
      '</div><div class="recap-list">'+
      (rows.map(function(r){
        var det=[];
        if(r.adults>0)det.push('+'+r.adults+' adulte'+(r.adults>1?'s':''));
        if(r.kids>0)det.push(r.kids+' enfant'+(r.kids>1?'s':''));
        if(r.note)det.push('« '+r.note+' »');
        return '<div><span class="who">'+esc(r.name)+'</span> — '+
          (r.choice==='oui'?'présent(e)':r.choice==='non'?'absent(e)':'peut-être')+
          (det.length?'<div class="det">'+esc(det.join(' · '))+'</div>':'')+'</div>';
      }).join('')||'<div class="empty">Aucune réponse pour l’instant.</div>')+'</div>';
  }

  /* ---------- Journal & relevé ---------- */
  function paintJournal(){
    document.getElementById('journal').innerHTML=journal.map(function(e){
      return '<div><b>'+hm(e.t)+'</b> — '+esc(e.txt)+'</div>';
    }).join('')||'<div class="empty">Aucun changement pour l’instant.</div>';
  }
  document.getElementById('releve').addEventListener('click',function(){
    var att=orders.filter(function(o){return o.status==='attente'}).length;
    var txt='Relevé des stands — '+now()+'\n'+STANDS.map(function(o){
      var x=st[o.id]||{s:'ok'};
      return o.n.replace(/^\S+\s/,'')+' : '+standLabel(x)+(o.star&&x.s!=='off'?' (~'+(x.w||5)+' min)':'');
    }).join('\n')+'\nCommandes cocktails en attente : '+att;
    logEvent('Relevé horaire copié');
    function done(){toast('Relevé copié — collez-le dans WhatsApp 📋');fetchAll()}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){window.prompt('Copiez le relevé :',txt);done()})}
    else{window.prompt('Copiez le relevé :',txt);done()}
  });
})();
</script>
</body>
</html>
