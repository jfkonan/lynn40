# Projet XcodeGen : génère Dictee.xcodeproj.
#   brew install xcodegen && cd dictee/apple && xcodegen generate
name: Dictee

options:
  bundleIdPrefix: com.jfkonan
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  developmentLanguage: fr
  createIntermediateGroups: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Dictee:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Shared
    dependencies:
      - target: DicteeKeyboard
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dictée
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Dictée enregistre votre voix pour la transcrire en texte avec votre clé API (OpenAI, Mistral ou Microsoft)."
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - dictee
        AppGroupIdentifier: $(APP_GROUP_ID)
    entitlements:
      path: App/Dictee.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).dictee
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  DicteeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Dictée
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: fr-FR
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/DicteeKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).dictee.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES

  DicteeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Dictee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).dictee.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Dictee.app/Dictee
        BUNDLE_LOADER: $(TEST_HOST)

  # --- macOS : app de barre des menus (raccourci global, collage au curseur) ---
  DicteeMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Mac
        excludes:
          - "Tests/**"
      - path: Core
      - path: Shared
        excludes:
          # Signaux app ↔ clavier iOS : inutiles sur Mac.
          - "DarwinNotifier.swift"
          # Logique pure du clavier AZERTY iOS (compilée dans l'app iOS pour DicteeTests).
          - "KeyboardLogic/**"
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Dictée
        CFBundleName: Dictée
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSMicrophoneUsageDescription: "Dictée enregistre votre voix pendant que vous maintenez le raccourci, pour la transcrire en texte avec votre clé API (OpenAI, Mistral ou Microsoft)."
    entitlements:
      path: Mac/DicteeMac.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).dictee.mac
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  DicteeMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Mac/Tests
    dependencies:
      - target: DicteeMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).dictee.mac.tests
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DicteeMac.app/Contents/MacOS/DicteeMac
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Dictee:
    build:
      targets:
        Dictee: all
        DicteeKeyboard: all
    test:
      targets:
        - DicteeTests

  DicteeMac:
    build:
      targets:
        DicteeMac: all
    test:
      targets:
        - DicteeMacTests
